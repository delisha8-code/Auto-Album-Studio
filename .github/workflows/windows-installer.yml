name: Build Windows installer (unsigned preview)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
        run: npm run pack:win
      - name: Verify installer and native image dependencies
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($installers.Count -lt 1) { throw 'No Windows installer was produced' }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 1000000) { throw "Installer is unexpectedly small: $($installer.Name)" }
            $stream = [System.IO.File]::OpenRead($installer.FullName)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid Windows executable: $($installer.Name)" }
            } finally { $stream.Dispose() }
          }
          $unpacked = 'release/win-unpacked/resources/app.asar.unpacked/node_modules'
          if (!(Test-Path "$unpacked/sharp")) { throw 'Packaged Sharp native dependency is missing' }
          if (!(Test-Path "$unpacked/@img")) { throw 'Packaged Sharp platform binaries are missing' }
          Write-Host "Verified $($installers.Count) unsigned installer(s) and native dependency folders"
      - name: Smoke-test packaged Electron and Sharp
        shell: pwsh
        run: |
          $app = 'release/win-unpacked/Auto Album Studio.exe'
          if (!(Test-Path $app)) { throw 'Packaged application executable missing' }
          $env:AAS_PACKAGED_SMOKE_TEST = '1'
          $process = Start-Process -FilePath (Resolve-Path $app).Path -PassThru
          try {
            if (!$process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Packaged application smoke test timed out'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed with exit code $($process.ExitCode)" }
            Write-Host 'Packaged Electron startup and Sharp native processing succeeded'
          } finally {
            Remove-Item Env:AAS_PACKAGED_SMOKE_TEST -ErrorAction SilentlyContinue
          }
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: auto-album-studio-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
