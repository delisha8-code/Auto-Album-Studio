name: Build Windows installer (unsigned preview)
on:
  workflow_dispatch:
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package unsigned NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
        run: npm run pack:win
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: auto-album-studio-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
